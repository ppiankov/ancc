name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (inside) exit
              if ($0 ~ "^## \\[" ver "\\]") { inside=1; next }
            }
            inside { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/RELEASE_NOTES.md"
          if [ ! -s "${RUNNER_TEMP}/RELEASE_NOTES.md" ]; then
            echo "::error::No CHANGELOG entry found for $VERSION"
            exit 1
          fi
          echo "Release notes for $VERSION:"; cat "${RUNNER_TEMP}/RELEASE_NOTES.md"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean --release-notes=${{ runner.temp }}/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
